    <!-- SEO Meta Tags -->
    <title>Manāra — AI Property Marketing Workspace for Real Estate</title>
    <meta
      name="description"
      content="Manāra transforms floor plans, photography, and property details into a complete buyer-ready package: branded floor plans, virtual staging, photorealistic 3D renders, brochures, and shareable property pages."
    />
    <meta
      name="keywords"
      content="AI property marketing, real estate visualization, virtual staging, floor plans, 3D renders, luxury property marketing, Dubai real estate, property brochures"
